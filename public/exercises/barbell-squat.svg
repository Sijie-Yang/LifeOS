<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" width="620" height="348" role="img" aria-label="杠铃深蹲"><rect width="620" height="348" rx="14" fill="#ffffff"/><g transform="translate(0,0)"><rect x="0" y="0" width="300" height="290" rx="12" fill="#f8fafc" stroke="#e4e4e7"/><text x="14" y="24" font-size="14" fill="#3f3f46" text-anchor="start" font-weight="600" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif">① 起始：杠铃放在上背（斜方肌上），站直</text><line x1="14" y1="262" x2="286" y2="262" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round"/><polyline points="136,156 134,208 130,256 146,260" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><line x1="136" y1="156" x2="140" y2="208" stroke="#334155" stroke-width="10" stroke-linecap="round"/><line x1="140" y1="208" x2="136" y2="256" stroke="#334155" stroke-width="9" stroke-linecap="round"/><line x1="136" y1="256" x2="152" y2="260" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="140" y1="86" x2="136" y2="156" stroke="#334155" stroke-width="13" stroke-linecap="round"/><circle cx="144" cy="62" r="14" fill="#334155"/><line x1="140" y1="86" x2="118" y2="104" stroke="#334155" stroke-width="8" stroke-linecap="round"/><line x1="118" y1="104" x2="140" y2="86" stroke="#334155" stroke-width="7" stroke-linecap="round"/><circle cx="134" cy="82" r="16" fill="#71717a"/><circle cx="134" cy="82" r="4" fill="#d4d4d8"/></g><g transform="translate(320,0)"><rect x="0" y="0" width="300" height="290" rx="12" fill="#f8fafc" stroke="#e4e4e7"/><text x="14" y="24" font-size="14" fill="#3f3f46" text-anchor="start" font-weight="600" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif">② 蹲到大腿至少平行，再站起</text><line x1="14" y1="262" x2="286" y2="262" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round"/><polyline points="108,204 170,214 134,256 150,260" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><line x1="108" y1="204" x2="176" y2="214" stroke="#f97316" stroke-width="10" stroke-linecap="round"/><line x1="176" y1="214" x2="140" y2="256" stroke="#334155" stroke-width="9" stroke-linecap="round"/><line x1="140" y1="256" x2="156" y2="260" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="142" y1="138" x2="108" y2="204" stroke="#334155" stroke-width="13" stroke-linecap="round"/><circle cx="152" cy="116" r="14" fill="#334155"/><line x1="142" y1="138" x2="116" y2="154" stroke="#334155" stroke-width="8" stroke-linecap="round"/><line x1="116" y1="154" x2="140" y2="136" stroke="#334155" stroke-width="7" stroke-linecap="round"/><circle cx="136" cy="132" r="16" fill="#71717a"/><circle cx="136" cy="132" r="4" fill="#d4d4d8"/><path d="M70,150 L70,205" fill="none" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 0"/><polygon points="70,205 65.2,195.1 74.8,195.1" fill="#4f46e5"/></g><text x="310.0" y="316" font-size="14" fill="#3f3f46" text-anchor="middle" font-weight="normal" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif">一定在深蹲架里、设好保护杆；膝盖和脚尖同方向，胸挺起；先从空杆练动作</text><text x="310.0" y="336" font-size="12" fill="#71717a" text-anchor="middle" font-weight="normal" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif"><tspan fill="#f97316">■</tspan> 发力部位   <tspan fill="#4f46e5">➜</tspan> 运动方向</text></svg>