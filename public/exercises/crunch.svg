<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" width="620" height="348" role="img" aria-label="卷腹"><rect width="620" height="348" rx="14" fill="#ffffff"/><g transform="translate(0,0)"><rect x="0" y="0" width="300" height="290" rx="12" fill="#f8fafc" stroke="#e4e4e7"/><text x="14" y="24" font-size="14" fill="#3f3f46" text-anchor="start" font-weight="600" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif">① 起始：仰卧屈膝，手放耳边</text><rect x="30" y="252" width="250" height="8" rx="3" fill="#e4e4e7"/><line x1="150" y1="244" x2="194" y2="206" stroke="#334155" stroke-width="10" stroke-linecap="round"/><line x1="194" y1="206" x2="232" y2="246" stroke="#334155" stroke-width="9" stroke-linecap="round"/><line x1="232" y1="246" x2="244" y2="250" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="88" y1="240" x2="150" y2="244" stroke="#334155" stroke-width="13" stroke-linecap="round"/><circle cx="64" cy="232" r="14" fill="#334155"/><line x1="88" y1="240" x2="70" y2="222" stroke="#334155" stroke-width="8" stroke-linecap="round"/><line x1="70" y1="222" x2="62" y2="234" stroke="#334155" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(320,0)"><rect x="0" y="0" width="300" height="290" rx="12" fill="#f8fafc" stroke="#e4e4e7"/><text x="14" y="24" font-size="14" fill="#3f3f46" text-anchor="start" font-weight="600" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif">② 用腹部把肩膀卷离地面，下背贴地</text><rect x="30" y="252" width="250" height="8" rx="3" fill="#e4e4e7"/><line x1="150" y1="244" x2="194" y2="206" stroke="#334155" stroke-width="10" stroke-linecap="round"/><line x1="194" y1="206" x2="232" y2="246" stroke="#334155" stroke-width="9" stroke-linecap="round"/><line x1="232" y1="246" x2="244" y2="250" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="108" y1="214" x2="150" y2="244" stroke="#f97316" stroke-width="13" stroke-linecap="round"/><circle cx="92" cy="196" r="14" fill="#334155"/><line x1="108" y1="214" x2="88" y2="194" stroke="#334155" stroke-width="8" stroke-linecap="round"/><line x1="88" y1="194" x2="86" y2="208" stroke="#334155" stroke-width="7" stroke-linecap="round"/><path d="M60,180 Q66,160 90,160" fill="none" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 0"/><polygon points="90,160 80.1,164.8 80.1,155.2" fill="#4f46e5"/></g><text x="310.0" y="316" font-size="14" fill="#3f3f46" text-anchor="middle" font-weight="normal" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif">不要用手拉脖子；呼气卷起、吸气慢慢放下；进阶可以做悬垂举腿</text><text x="310.0" y="336" font-size="12" fill="#71717a" text-anchor="middle" font-weight="normal" font-family="-apple-system, PingFang SC, Helvetica, Arial, sans-serif"><tspan fill="#f97316">■</tspan> 发力部位   <tspan fill="#4f46e5">➜</tspan> 运动方向</text></svg>